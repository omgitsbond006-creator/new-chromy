name: orbiquo
description: "Orbiquo - a neon orbit arcade game. Hop between rings, dodge hazards and collect gems."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/audio/

# Run `dart run flutter_launcher_icons` once to generate launcher icons
# for Android and iOS from assets/icon/icon.png.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0820"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
